name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-daemon libmpv2 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen dbus-run-session -- python -m unittest discover -s tests -v
      - name: Check release versions
        run: python scripts/check_version.py
      - name: Run Ruff
        run: ruff check entropy tests scripts
